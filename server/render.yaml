services:
  - type: web
    name: osusu-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROUP_SIZE
        value: "8"
      - key: CORS_ORIGIN
        value: "*"
